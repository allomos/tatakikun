name: Tatakikun
options:
  bundleIdPrefix: com.tatakikun
  deploymentTarget:
    iOS: "16.0"
packages:
  TatakikunPackage:
    path: ..
settings:
  base:
    # The version comes from the Mac app's App/Info.plist at every build (scripts/ios-version.sh).
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  # The app holds the keyboard and tells how to turn it on. (Not named Tatakikun: the package
  # has a macOS executable of that name.)
  TatakikunIOS:
    type: application
    platform: iOS
    sources:
      - App
      - Keyboard/KeyboardView.swift
    dependencies:
      - target: TatakikunKeyboard
      - package: TatakikunPackage
        product: TatakikunCore
    postBuildScripts:
      - name: Version from the Mac app
        script: '"$SRCROOT/../scripts/ios-version.sh"'
        basedOnDependencyAnalysis: false
        # After Xcode has written the Info.plist, or it overwrites the version again.
        inputFiles: ['$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)']
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tatakikun
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tatakikun.ios.Tatakikun
        PRODUCT_NAME: Tatakikun
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TatakikunUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TatakikunIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tatakikun.ios.UITests
        GENERATE_INFOPLIST_FILE: YES
  # The keyboard: the same engine and language packs as the macOS input method.
  TatakikunKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - path: ../build/packs
        type: folder
        buildPhase: resources
    dependencies:
      - package: TatakikunPackage
        product: TatakikunCore
    postBuildScripts:
      - name: Version from the Mac app
        script: '"$SRCROOT/../scripts/ios-version.sh"'
        basedOnDependencyAnalysis: false
        # After Xcode has written the Info.plist, or it overwrites the version again.
        inputFiles: ['$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)']
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Tatakikun
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            # Full Access: copy and cut with Ctrl on iPad (A04-cell054). The app explains it first.
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tatakikun.ios.Tatakikun.Keyboard
schemes:
  Tatakikun:
    build:
      targets:
        TatakikunIOS: all
    test:
      targets: [TatakikunUITests]
