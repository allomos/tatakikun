<h2>Tatakikun</h2>
<p>英字で入力すると、英語・中国語・日本語の候補が並んで表示されます。</p>
<p>次の画面でインストールする言語パックを選んでください。候補はインストールした言語だけに出ます。入力した英字そのものは常に候補に出ます。</p>
<p>インストール後に一度だけ追加します:システム設定 → キーボード → テキスト入力 → 入力ソース → 編集… → + → 英語 → Tatakikun。一覧にないときはログアウトしてログインし直してください。</p>
