<h2>Tatakikun 已安装</h2>
<p>安装时已经打开的应用:如果菜单栏显示 Tatakikun,但在某个应用里打字没有反应,请用 ⌘Q 完全退出这个应用再打开。</p>
<p>VS Code、Slack 等 Electron 应用需要这样做。安装时结束了之前的 Tatakikun,这些应用要重新打开才会连上新的。文本编辑、Safari 等应用会自动重新连接。</p>
<p>第一次安装:在系统设置 → 键盘 → 文字输入 → 输入法 → 编辑… → + → 简体中文 → Tatakikun 添加一次。</p>
</body></html>
